desktop_selection: suggested
software:
  installation_repositories:
    - url: https://download.opensuse.org/distribution/leap/16.1/repo/oss/$basearch
  installation_labels:
    - label: Leap-DVD-x86_64
      archs: x86_64
    - label: Leap-DVD-aarch64
      archs: aarch64
    - label: Leap-DVD-s390x
      archs: s390
    - label: Leap-DVD-ppc64le
      archs: ppc
  mandatory_patterns:
    - enhanced_base # only pattern that is shared among all roles on Leap
  optional_patterns: [] # no optional pattern shared
  user_patterns:
    - name: gnome
      desktop: true
    - name: kde
      desktop: true
    - name: xfce_wayland
      desktop: true
    - name: lxqt_wayland
      desktop: true
    - name: openSUSEway
      desktop: true
    - multimedia
    - office
    - cockpit
    - fips
    - name: selinux
      selected: true
    - documentation
    - sw_management
    - container_runtime_podman
    - dhcp_dns_server
    - directory_server
    - file_server
    - gateway_server
    - kvm_server
    - kvm_tools
    - lamp_server
    - mail_server
    - printing
  mandatory_packages:
    - NetworkManager
    # bsc#1241224, bsc#1224868 avoid probe DHCP over all ethernet devices and ignore carrier
    - NetworkManager-config-server
    - openSUSE-repos-Leap
    - sudo-policy-wheel-auth-self # explicit wheel group policy to conform new auth model
  optional_packages: [ os-prober ]
  base_product: Leap

modes:
  - id: standard
    # ------------------------------------------------------------------------------
    # WARNING: When changing the mode name or description delete the translations
    # located at the translations/mode/<id> key above to avoid using obsolete
    # translations!!
    # ------------------------------------------------------------------------------
    name: Standard
    description: Standard system

    software:
      mandatory_patterns:
        - enhanced_base
      mandatory_packages:
        - Leap-release

    storage:
      space_policy: delete
      volumes:
        - "/"
        - "swap"
      volume_templates:
        - mount_path: "/"
          filesystem: btrfs
          btrfs:
            snapshots: true
            read_only: false
            default_subvolume: "@"
            subvolumes:
              - path: home
              - path: opt
              - path: root
              - path: srv
              - path: usr/local
              # Unified var subvolume - https://lists.opensuse.org/opensuse-packaging/2017-11/msg00017.html
              - path: var
                copy_on_write: false
          size:
            auto: true
          outline:
            required: true
            filesystems:
              - btrfs
              - ext2
              - ext3
              - ext4
              - xfs
            auto_size:
              base_min: 5 GiB
              base_max: 15 GiB
              snapshots_increment: 150%
              max_fallback_for:
                - "/home"
            snapshots_configurable: true
        - mount_path: "swap"
          filesystem: swap
          size:
            min: 1 GiB
            max: 2 GiB
          outline:
            required: false
            filesystems:
              - swap
        - mount_path: "/home"
          filesystem: xfs
          size:
            auto: false
            min: 5 GiB
            max: unlimited
          outline:
            required: false
            filesystems:
              - btrfs
              - ext2
              - ext3
              - ext4
              - xfs
        - filesystem: xfs
          size:
            auto: false
            min: 512 MiB
          outline:
            required: false
            filesystems:
              - btrfs
              - ext2
              - ext3
              - ext4
              - xfs
              - vfat

  - id: immutable
    # ------------------------------------------------------------------------------
    # WARNING: When changing the mode name or description delete the translations
    # located at the translations/mode/<id> key above to avoid using obsolete
    # translations!!
    # ------------------------------------------------------------------------------
    name: Immutable
    description: Immutable system with atomic updates

    software:
      mandatory_patterns:
        - immutable_base
      mandatory_packages:
        - Leap_immutable-release
      user_patterns:
        - name: enhanced_base
          selected: true

    storage:
      space_policy: delete
      volumes:
        - "/"
        - "/var"
      volume_templates:
        - mount_path: "/"
          filesystem: btrfs
          btrfs:
            snapshots: true
            read_only: true
            default_subvolume: "@"
            subvolumes:
              - path: home
              - path: opt
              - path: root
              - path: srv
              - path: usr/local
              - path: boot/writable
              # Unified var subvolume - https://lists.opensuse.org/opensuse-packaging/2017-11/msg00017.html
              - path: var
                copy_on_write: false
              # Architecture specific subvolumes
              - path: boot/grub2/arm64-efi
                archs: aarch64
              - path: boot/grub2/x86_64-efi
                archs: x86_64
          size:
            auto: true
          outline:
            required: true
            snapshots_configurable: false
            filesystems:
              - btrfs
            auto_size:
              base_min: 5 GiB
              base_max: 25 GiB
              max_fallback_for:
                - "/var"
        - mount_path: "/var"
          filesystem: btrfs
          mount_options:
            - "x-initrd.mount"
            - "nodatacow"
          size:
            auto: false
            min: 5 GiB
          outline:
            required: false
            filesystems:
              - btrfs
        - filesystem: xfs
          size:
            auto: false
            min: 512 MiB
          outline:
            required: false
            filesystems:
              - btrfs
              - ext2
              - ext3
              - ext4
              - xfs
              - vfat
              - swap
