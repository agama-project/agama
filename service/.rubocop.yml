# use the shared Yast defaults
inherit_from:
  /usr/share/YaST2/data/devtools/data/rubocop-1.24.1_yast_style.yml

# vendor is not controlled by us and YaST2 contains old code we do not want to rewrite now
AllCops:
  Exclude:
    - vendor/**/*
    - YaST2/**/*
    - agama-yast.gemspec
    - package/*.spec

# a D-Bus method definition may take up more line length than usual
Layout/LineLength:
  IgnoredPatterns:
    - dbus_method

# a D-Bus interface definition may take up more lines than a regular method
Metrics/BlockLength:
  IgnoredMethods:
    - dbus_interface

# assignment in method calls is used to document some params
Lint/UselessAssignment:
  Enabled: false

# be less strict
Metrics/AbcSize:
  Max: 33

Metrics/ClassLength:
  Max: 300

# tests under test/YaST2/modules mirror the CamelCase filenames of the vendored YaST module
# classes they test (service/YaST2/modules/*.rb), to stay easy to compare against upstream
Naming/FileName:
  Exclude:
    - test/YaST2/modules/*.rb
