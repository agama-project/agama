---
:sourceurl: "%{mod_full_name}.gem"
:preamble: |-
  %global rb_build_versions %{rb_default_ruby}
  BuildRequires:  dbus-1-common
  Requires:       dbus-1-common
:main:
  :preamble: |-
    # Override build.rpm, see also https://github.com/openSUSE/obs-build/blob/master/configs/
    %global rb_build_versions %{rb_default_ruby}
    BuildRequires:  dbus-1-common
    Requires:       dbus-1-common
    Requires:       dbus-1-daemon
    # YaST dependencies
    # ArchFilter
    Requires:       yast2 >= 4.5.20
    Requires:       yast2-hardware-detection
    # yast2-bootloader's Ruby code (Bootloader::*, Yast::Bootloader, Yast::BootStorage) is vendored
    # into service/YaST2/lib/bootloader and service/YaST2/modules (see service/YaST2/README.md);
    # the RPM is no longer needed. grub2/sdbootutil and friends (below) still provide the actual
    # bootloader binaries the vendored code shells out to.
    # yast2-iscsi-client's Ruby code (Yast::IscsiClientLib, Y2IscsiClient::*) is vendored into
    # service/YaST2/lib/y2iscsi_client and service/YaST2/modules (see service/YaST2/README.md);
    # the RPM is no longer needed. open-iscsi (below) still provides the iscsiadm/iscsiuio
    # binaries IscsiClientLib shells out to.
    # yast2-storage-ng's Ruby code (Y2Storage::*) is vendored into service/YaST2/lib/y2storage
    # (see service/YaST2/README.md); the RPM itself is no longer needed. Two of its own
    # dependencies are native (non-Ruby) bindings that cannot be vendored and are now declared
    # directly instead of relying on them being pulled in transitively. A third one,
    # yast2-packager, is NOT declared here despite Y2Storage::DiskAnalyzer needing
    # Y2Packager::Repository: yast2-packager and yast2-storage-ng have a circular RPM
    # Requires: on each other, so declaring yast2-packager would silently pull
    # yast2-storage-ng straight back in. Y2Packager::Repository (and its one real dependency,
    # Y2Packager::ZyppUrl) is vendored into service/YaST2/lib/y2packager instead - see
    # service/YaST2/README.md.
    Requires:       libstorage-ng-ruby
    Requires:       yast2-pkg-bindings
    # yast2-transfer provides the classic Yast::FTP/HTTP/TFTP modules that the already-vendored
    # lib/transfer/file_from_url.rb (service/YaST2/README.md, AutoYaST phase) unconditionally
    # imports. Like yast2-pkg-bindings above, this was previously only a transitive dependency
    # (pulled in by yast2-packager.spec's own Requires: yast2-transfer) - found the same way as
    # the yast2-packager gaps: by validating with yast2-storage-ng actually uninstalled.
    Requires:       yast2-transfer
    # s390-only yast2-* dependencies previously required here (all now dropped):
    # yast2-s390's Ruby code (Y2S390::Dasd/DasdsCollection/DasdsReader/FormatProcess/ZFCP) is
    # vendored into service/YaST2/lib/y2s390 (see service/YaST2/README.md). yast2-cio was confirmed
    # unused (its only content is an interactive channel-blacklist dialog Agama never runs) and
    # dropped outright. yast2-reipl's only real effect (Bootloader::FinishClient's s390
    # "reipl_bootloader_finish" WFM dispatch, i.e. running `chreipl node /boot/zipl`) is now
    # inlined directly into the vendored FinishClient (see service/YaST2/README.md).
    # Storage dependencies
    Requires:       bcache-tools
    Requires:       btrfsprogs
    Requires:       cryptsetup
    Requires:       dosfstools
    Requires:       e2fsprogs
    Requires:       exfatprogs
    Requires:       fcoe-utils
    %ifarch x86_64 aarch64
    Requires:       fde-tools
    %endif
    Requires:       jfsutils
    Requires:       libstorage-ng-lang
    Requires:       lvm2
    Requires:       mdadm
    Requires:       multipath-tools
    Requires:       nfs-client
    Requires:       ntfs-3g
    Requires:       ntfsprogs
    Requires:       nvme-cli
    Requires:       open-iscsi
    Requires:       quota
    Requires:       snapper
    Requires:       udftools
    Requires:       xfsprogs
    Requires:       yast2-schema
    # lsblk
    Requires:       util-linux-systemd
    # AutoYaST compatibility
    Requires:       xsltproc
