---
:sourceurl: "%{mod_full_name}.gem"
:preamble: |-
  %global rb_build_versions %{rb_default_ruby}
  BuildRequires:  dbus-1-common
  Requires:       dbus-1-common
:main:
  :preamble: |-
    # Override build.rpm, see also https://github.com/openSUSE/obs-build/blob/master/configs/
    %global rb_build_versions %{rb_default_ruby}
    BuildRequires:  dbus-1-common
    Requires:       dbus-1-common
    Requires:       dbus-1-daemon
    # YaST dependencies
    # ArchFilter
    Requires:       yast2 >= 4.5.20
    Requires:       yast2-bootloader >= 5.0.30
    Requires:       yast2-hardware-detection
    # yast2-iscsi-client's Ruby code (Yast::IscsiClientLib, Y2IscsiClient::*) is vendored into
    # service/YaST2/lib/y2iscsi_client and service/YaST2/modules (see service/YaST2/README.md);
    # the RPM is no longer needed. open-iscsi (below) still provides the iscsiadm/iscsiuio
    # binaries IscsiClientLib shells out to.
    Requires:       yast2-storage-ng >= 5.0.49
    %ifarch s390 s390x
    # yast2-s390's Ruby code (Y2S390::Dasd/DasdsCollection/DasdsReader/FormatProcess/ZFCP) is
    # vendored into service/YaST2/lib/y2s390 (see service/YaST2/README.md); the RPM is no longer
    # needed. yast2-cio was confirmed unused (its only content is an interactive channel-blacklist
    # dialog Agama never runs) and dropped outright.
    # yast2-reipl stays for now: Bootloader::FinishClient (from yast2-bootloader, not yet vendored)
    # dynamically dispatches to its "reipl_bootloader_finish" client on every s390 install; it can
    # only be dropped once that dispatch is replaced when yast2-bootloader itself is vendored.
    Requires:       yast2-reipl
    %endif
    # Storage dependencies
    Requires:       bcache-tools
    Requires:       btrfsprogs
    Requires:       cryptsetup
    Requires:       dosfstools
    Requires:       e2fsprogs
    Requires:       exfatprogs
    Requires:       fcoe-utils
    %ifarch x86_64 aarch64
    Requires:       fde-tools
    %endif
    Requires:       jfsutils
    Requires:       libstorage-ng-lang
    Requires:       lvm2
    Requires:       mdadm
    Requires:       multipath-tools
    Requires:       nfs-client
    Requires:       ntfs-3g
    Requires:       ntfsprogs
    Requires:       nvme-cli
    Requires:       open-iscsi
    Requires:       quota
    Requires:       snapper
    Requires:       udftools
    Requires:       xfsprogs
    Requires:       yast2-schema
    # lsblk
    Requires:       util-linux-systemd
    # AutoYaST compatibility
    Requires:       xsltproc
