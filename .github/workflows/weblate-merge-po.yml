name: Weblate Merge PO

# Note: GitHub runs scheduled jobs only from the default branch ("master"),
# although some jobs are intended for the SLE-* branches they must be defined
# in the "master".

permissions:
  # it merges the updated translations and creates a pull request with the changes
  contents: write
  pull-requests: write

on:
  schedule:
    # run every Monday at 2:35AM UTC
    - cron: "35 2 * * Mon"

  # allow running manually
  workflow_dispatch:

jobs:
  merge-po:
    name: ${{ matrix.component }} (${{ matrix.branch }})

    # allow pushing and creating pull requests
    permissions:
      contents: write
      pull-requests: write

    # do not run in forks
    if: ${{ !github.event.repository.fork }}

    runs-on: ubuntu-latest

    strategy:
      # a failure in one component or branch must not block the others
      fail-fast: false
      matrix:
        branch: [master, SLE-16, SLE-16.1]
        component: [web, products, service, rust]
        exclude:
          # the Rust code is not present in the SLE-16 branch
          - branch: SLE-16
            component: rust
        include:
          # per-branch settings
          - branch: master
            # empty means the default branch
            ref: ""
            image: registry.opensuse.org/opensuse/tumbleweed:latest
            disable_repos: repo-non-oss repo-openh264 repo-update
            branch_suffix: ""
            title_suffix: ""
          - branch: SLE-16
            ref: SLE-16
            image: registry.opensuse.org/opensuse/leap:16.0
            disable_repos: openSUSE:repo-openh264
            branch_suffix: _sle16
            title_suffix: " (SLE-16)"
          - branch: SLE-16.1
            ref: SLE-16.1
            # FIXME: the 16.1 container is not published yet, switch to 16.1 when it is released
            image: registry.opensuse.org/opensuse/leap:16.0
            disable_repos: openSUSE:repo-openh264
            branch_suffix: _sle16.1
            title_suffix: " (SLE-16.1)"

          # per-component settings
          - component: web
            packages: nodejs npm git gettext-tools python3-langtable
            commit_message: Update web translation files
            pr_title: Update web translation files
            pr_body: Updating the web translation files from the agama-weblate repository
          - component: products
            packages: git gettext-tools npm-default
            commit_message: Update translations in the product files
            pr_title: Update translations in the product files
            pr_body: Updating the product translations from the agama-weblate repository
          - component: service
            packages: git gettext-tools
            commit_message: Update service PO files
            pr_title: Update service PO files
            pr_body: Updating the service translation files from the agama-weblate repository
          - component: rust
            packages: git gettext-tools
            commit_message: Update rust PO files
            pr_title: Update rust PO files
            pr_body: Updating the rust translation files from the agama-weblate repository

    container:
      image: ${{ matrix.image }}
      volumes:
        # bind mount the GitHub CLI tool from the Ubuntu host,
        # it is a statically linked binary so it should work also in the openSUSE containers
        - /usr/bin/gh:/usr/bin/gh

    env:
      COMPONENT: ${{ matrix.component }}
      # use an unique branch to avoid possible conflicts with already existing branches
      PR_BRANCH: po_merge_${{ matrix.component }}${{ matrix.branch_suffix }}_${{ github.run_id }}

    steps:
      - name: Configure and refresh repositories
        run: |
          # disable unused repositories to have a faster refresh
          zypper modifyrepo -d ${{ matrix.disable_repos }} && \
            zypper --non-interactive ref

      - name: Install tools
        run: zypper --non-interactive install --no-recommends ${{ matrix.packages }}

      - name: Configure Git
        run: |
          git config --global user.name "YaST Bot"
          git config --global user.email "yast-devel@opensuse.org"

      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          path: agama
          ref: ${{ matrix.ref }}

      - name: Checkout Agama-weblate sources
        uses: actions/checkout@v7
        with:
          path: agama-weblate
          repository: ${{ github.repository_owner }}/agama-weblate
          ref: ${{ matrix.ref }}

      - name: Validate the PO files
        working-directory: ./agama-weblate
        run: |
          for po in "${COMPONENT}"/*.po; do
            msgfmt --check-format -o /dev/null "$po"
          done

      - name: Install NPM packages (web)
        if: matrix.component == 'web'
        working-directory: ./agama/web/share/po
        run: npm ci

      - name: Update JS translations
        if: matrix.component == 'web'
        working-directory: ./agama
        run: |
          mkdir -p web/src/po
          # delete the current translations
          find web/src/po -name '*.js' -exec git rm '{}' ';'

          # update the list of supported languages, it is used by the PO->JS converter in the next step
          web/share/update-languages.py --po-directory ../agama-weblate/web > web/src/languages.json

          # rebuild the JS files
          (cd web/src/po && SRCDIR=../../../../agama-weblate/web ../../share/po/po-converter.js)

          # stage the changes
          git add web/src/po/*.js web/src/languages.json

      - name: Install NPM packages (products)
        if: matrix.component == 'products'
        working-directory: ./agama/.github/workflows/product_translations
        run: npm ci

      - name: Update product files with translations
        if: matrix.component == 'products'
        env:
          NODE_PATH: ./agama/.github/workflows/product_translations
        run: |
          "${NODE_PATH}/merge_po" agama-weblate/products agama/products.d

      - name: Update PO files
        if: matrix.component == 'service' || matrix.component == 'rust'
        working-directory: ./agama
        run: |
          # delete the current translations
          find "${COMPONENT}/po" -name '*.po' -exec git rm '{}' ';'

          # copy the new ones
          mkdir -p "${COMPONENT}/po"
          cp -a ../agama-weblate/"${COMPONENT}"/*.po "${COMPONENT}/po"
          git add "${COMPONENT}"/po/*.po

      # any changes detected?
      - name: Check changes
        id: check_changes
        working-directory: ./agama
        run: |
          case "${COMPONENT}" in
            web)
              git diff --staged web > tr.diff
              ;;
            products)
              git diff products.d > tr.diff
              ;;
            *)
              # ignore the timestamp changes in the PO files
              git diff --staged --ignore-matching-lines="POT-Creation-Date:" \
                --ignore-matching-lines="PO-Revision-Date:" "${COMPONENT}/po" > tr.diff
              ;;
          esac

          if [ -s tr.diff ]; then
            echo "Translations updated"
            # this is an Output Parameter
            # https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#setting-an-output-parameter
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "Translations not changed"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

          rm tr.diff

      - name: Push updated files
        # run only when a file has been updated
        if: steps.check_changes.outputs.updated == 'true'
        working-directory: ./agama
        run: |
          git checkout -b "${PR_BRANCH}"
          git commit -a -m "${{ matrix.commit_message }}"$'\n\n'"Agama-weblate commit: $(git -C ../agama-weblate rev-parse HEAD)"
          git push origin "${PR_BRANCH}"

      - name: Create pull request
        # run only when a file has been updated
        if: steps.check_changes.outputs.updated == 'true'
        working-directory: ./agama
        run: |
          gh pr create -B "${{ matrix.branch }}" -H "${PR_BRANCH}" \
            --label translations --label bot \
            --title "${{ matrix.pr_title }}${{ matrix.title_suffix }}" \
            --body "${{ matrix.pr_body }}"
        env:
          GH_TOKEN: ${{ github.token }}
